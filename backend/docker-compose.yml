version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: incident_db
    restart: always
    environment:
      POSTGRES_DB: incidents_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./seed.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d incidents_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: incident_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/incidents_db
      PORT: 3000
      UPLOAD_DIR: uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data:
